# Root logger level and attached appenders
log4j.rootLogger = DEBUG, CONSOLE, FILE

# 1. Console Appender for Eclipse terminal output
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.conversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c{1} - %m%n

# 2. Rolling File Appender to prevent huge log files
log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=./logs/App/log4j/log.out
log4j.appender.FILE.MaxFileSize=5MB
log4j.appender.FILE.MaxBackupIndex=3
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.conversionPattern=%d %-5p [%t] %C - %m%n
